<!DOCTYPE html>
<html lang="en">    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Calculator</title>
   
     <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-layout">
        <div class="image-panel">
            <img src="images/loans.png" alt="splash image for loan calculation">
            <div class="image-overlay">
                <p>Money Math Ahead >>> </p>
            </div>
        </div>

        <div class="calculator">
           
            <h2>Loan Calculator</h2> 
            <input type="number" step="1000" min="0" max="10000000" id="loanAmount" placeholder="Loan Amount" required>
            <input type="number" step="0.1" min="0" max="100" id="interestRate" placeholder="Annual Interest Rate (%)" required>
            <input type="number" step="1" min="0" max="30" id="loanTerm" placeholder="Loan Term (years)" required>
            <button onclick="calculateLoan()">Calculate</button>
            <div class="result" id="result"></div>
        </div>
    </div>

   <script src="logic.js" defer></script> 
</body>
</html>
